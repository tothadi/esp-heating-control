# One heating zone of the controller. Included 8 times from heating-controller.yaml with these vars:
#
#   n            zone number 1-8 (relay Zn, NTCn input, TERMn input, zone LED n)
#   zname        display name, also the base of the Home Assistant entity IDs (e.g. "Living room" ->
#                climate.heating_controller_living_room)
#   relay_pin    MCP23017 #1 (0x20) pin of relay Zn (GPA0..7 = 0..7)
#   led_pin      MCP23017 #2 (0x21) pin of zone LED n (GPB0..7 = 8..15)
#   term_pin     MCP23017 #2 (0x21) pin of thermostat input TERMn (GPA0..7 = TERM8..TERM1, reversed on the PCB)
#   ads, mux     ADS1115 and channel of NTCn (0x48 A3..A0 = NTC1..4, 0x49 A3..A0 = NTC5..8)
#   vref         NTC divider supply voltage as seen by that ADS1115
#   room_sensor  Home Assistant entity with the room temperature (e.g. a Zigbee thermostat's temperature sensor);
#                a sensor mapped in coprocessor.yaml (if included) takes precedence
#   mode         "HEAT" or "OFF" at first boot
#   comfort, night, boost      default schedule temperatures (°C)
#   night_on, boost_on         default of the night setback / evening boost switches (RESTORE_DEFAULT_ON/_OFF)
#   floor_type   "Tiles", "Laminate" or "No probe"
#   floor_limit  default floor overheat limit (°C)
#
# Everything a zone decides is computed in the central control loop in heating-controller.yaml; this file only
# declares the zone's hardware and its settings.

# --- Hardware -----------------------------------------------------------------------------------------------

switch:
  # Zone valve relay. Internal: the control loop owns it; Home Assistant sees the "valve" binary sensor instead.
  - platform: gpio
    id: zone${n}_relay
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: mcp_relays
      number: ${relay_pin}
      mode:
        output: true
    on_turn_on:
      - lambda: "id(zone_on_since)[${n} - 1] = millis();"
      - switch.turn_on: zone${n}_led
    on_turn_off:
      - switch.turn_off: zone${n}_led

  - platform: gpio
    id: zone${n}_led
    internal: true
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: mcp_io
      number: ${led_pin}
      mode:
        output: true

  # Schedule switches
  - platform: template
    id: zone${n}_night_on
    name: "${zname} night setback"
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_mode: ${night_on}
    on_turn_on:
      - lambda: "if (millis() > 30000) id(sched_period)[${n} - 1] = -2;"
    on_turn_off:
      - lambda: "if (millis() > 30000) id(sched_period)[${n} - 1] = -2;"
  - platform: template
    id: zone${n}_boost_on
    name: "${zname} evening boost"
    icon: mdi:weather-sunset
    entity_category: config
    optimistic: true
    restore_mode: ${boost_on}
    on_turn_on:
      - lambda: "if (millis() > 30000) id(sched_period)[${n} - 1] = -2;"
    on_turn_off:
      - lambda: "if (millis() > 30000) id(sched_period)[${n} - 1] = -2;"

binary_sensor:
  # Dry-contact thermostat input: 1 kΩ pull-up on the board, contact closed = demand.
  - platform: gpio
    id: zone${n}_wired
    name: "${zname} wired thermostat"
    device_class: heat
    pin:
      mcp23xxx: mcp_io
      number: ${term_pin}
      mode:
        input: true
      inverted: true
    filters:
      - delayed_on_off: 2s

  - platform: template
    name: "${zname} valve"
    device_class: opening
    icon: mdi:valve
    lambda: "return id(zone${n}_relay).state;"

  - platform: template
    name: "${zname} floor overheat"
    device_class: problem
    lambda: "return id(lockout)[${n} - 1];"

sensor:
  # --- Floor NTC: ADS1115 voltage -> resistance -> temperature --------------------------------------------
  # Sampled every second; the median of 60 raw voltages is passed on once a minute. This removes 50 Hz pickup on
  # long probe cables (the 10 µF input capacitor already filters most of it) and single bad I²C reads. Open
  # (> ${ntc_open_v} V) or shorted (< ${ntc_short_v} V) probes become NaN before conversion, so an unconnected input
  # can never produce a temperature. Calibrate with the offset filter against a reference thermometer.
  - platform: ads1115
    ads1115_id: ${ads}
    multiplexer: ${mux}
    gain: 4.096
    id: zone${n}_floor_v
    update_interval: 1s
    internal: true
    filters:
      - median:
          window_size: 60
          send_every: 60
          send_first_at: 60
      - lambda: "return (x > ${ntc_open_v} || x < ${ntc_short_v}) ? NAN : x;"
  - platform: resistance
    sensor: zone${n}_floor_v
    id: zone${n}_floor_r
    configuration: DOWNSTREAM
    resistor: ${ntc_ref_resistor}
    reference_voltage: ${vref}
    internal: true
  - platform: ntc
    sensor: zone${n}_floor_r
    id: zone${n}_floor
    name: "${zname} floor temperature"
    calibration:
      b_constant: ${ntc_b_constant}
      reference_temperature: 25°C
      reference_resistance: ${ntc_nominal}
    filters:
      - offset: 0.0
      - lambda: "return (x < 0.0 || x > 60.0) ? NAN : x;"
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
          send_first_at: 1

  # --- Room temperature --------------------------------------------------------------------------------------
  # From Home Assistant (any sensor, e.g. a Zigbee thermostat's temperature). If the API has been disconnected
  # for ${room_timeout} s the value is dropped (NaN): floor tempering (always active) then carries the zone alone, see the control
  # loop. Home Assistant keeps the last value of a sensor that went silent, so a stale reading cannot keep a zone
  # heating forever. With coprocessor.yaml, a Zigbee sensor mapped to this zone is used first (it becomes
  # NaN after its own timeout, and the Home Assistant value applies again).
  - platform: homeassistant
    id: zone${n}_room_ha
    entity_id: ${room_sensor}
    internal: true
  - platform: template
    id: zone${n}_room
    name: "${zname} room temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      // A co-processor sensor (coprocessor.yaml) takes precedence; NaN if not included, not mapped or stale.
      if (!std::isnan(id(cp_room)[${n} - 1])) return id(cp_room)[${n} - 1];
      if (id(ha_offline_s) >= ${room_timeout}) return NAN;
      return id(zone${n}_room_ha).state;

  - platform: template
    name: "${zname} floor target"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: 60s
    lambda: "return id(floor_tgt)[${n} - 1];"

text_sensor:
  - platform: template
    name: "${zname} state"
    icon: mdi:radiator
    update_interval: 10s
    lambda: |-
      static const char *const names[] = {"Off", "Idle", "Heating", "Floor tempering", "Floor overheat lockout",
                                          "Waiting (2 min relay guard)"};
      return std::string(names[id(zone_state)[${n} - 1]]);

# --- Room thermostat ----------------------------------------------------------------------------------------
# The zone's setpoint lives here, on the controller: the schedule changes it, Home Assistant can change it too, and
# it survives reboots. The thermostat only decides "room wants heat"; the control loop combines that with floor
# tempering, the floor lockout and the demand source. Mode "Off" closes the zone completely (no tempering).

climate:
  - platform: thermostat
    id: zone${n}_climate
    name: "${zname}"
    sensor: zone${n}_room
    min_heating_off_time: 120s
    min_heating_run_time: 120s
    min_idle_time: 30s
    heat_deadband: 0.2
    heat_overrun: 0.0
    heat_action:
      - lambda: ""
    idle_action:
      - lambda: ""
    visual:
      min_temperature: 10
      max_temperature: 28
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.1
    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: ${comfort}
        mode: ${mode}
    on_boot_restore_from: memory

# --- Settings -----------------------------------------------------------------------------------------------

select:
  - platform: template
    id: zone${n}_source
    name: "${zname} demand source"
    icon: mdi:thermostat
    entity_category: config
    optimistic: true
    restore_value: true
    # Room sensor: the controller's own thermostat with the Home Assistant room temperature.
    # Wired thermostat: the dry-contact input TERM${n} (works without Home Assistant and Wi-Fi).
    # Floor only: no room control, the floor is held at its target (tempering).
    options: ["Room sensor", "Wired thermostat", "Floor only"]
    initial_option: "Room sensor"
  - platform: template
    id: zone${n}_floor_type
    name: "${zname} floor type"
    icon: mdi:floor-plan
    entity_category: config
    optimistic: true
    restore_value: true
    # Tiles: floor target = setpoint + tile offset. Laminate (probe on the screed, under laminate): + laminate
    # offset while the room is below setpoint + 0.3 °C, + tile offset after that. No probe: no tempering, no
    # floor protection.
    options: ["Tiles", "Laminate", "No probe"]
    initial_option: "${floor_type}"

number:
  - platform: template
    id: zone${n}_limit
    name: "${zname} floor limit"
    icon: mdi:heat-wave
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 45
    step: 0.5
    initial_value: ${floor_limit}
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: zone${n}_comfort
    name: "${zname} comfort temperature"
    icon: mdi:thermometer
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 10
    max_value: 28
    step: 0.5
    initial_value: ${comfort}
    optimistic: true
    restore_value: true
    mode: box
    # a changed schedule temperature applies at the next check (30 s) if its period is active
    on_value:
      - lambda: "if (millis() > 30000) id(sched_period)[${n} - 1] = -2;"
  - platform: template
    id: zone${n}_night
    name: "${zname} night temperature"
    icon: mdi:thermometer-low
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 10
    max_value: 28
    step: 0.5
    initial_value: ${night}
    optimistic: true
    restore_value: true
    mode: box
    # a changed schedule temperature applies at the next check (30 s) if its period is active
    on_value:
      - lambda: "if (millis() > 30000) id(sched_period)[${n} - 1] = -2;"
  - platform: template
    id: zone${n}_boost
    name: "${zname} boost temperature"
    icon: mdi:thermometer-high
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 10
    max_value: 28
    step: 0.5
    initial_value: ${boost}
    optimistic: true
    restore_value: true
    mode: box
    # a changed schedule temperature applies at the next check (30 s) if its period is active
    on_value:
      - lambda: "if (millis() > 30000) id(sched_period)[${n} - 1] = -2;"
