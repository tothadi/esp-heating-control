# ESP Heating Control v4 - ESPHome firmware (ESP32-C6, logic board + power/IO board, see ../../hardware).
#
# The controller runs the whole heating control locally. Home Assistant is only a dashboard and remote control: it
# shows the controller's entities, can change setpoints, schedule times and settings, and supplies the room and
# outdoor temperatures. If Home Assistant or Wi-Fi is down, everything keeps running:
#
#   * zones with a wired thermostat (TERM inputs) run normally;
#   * floor tempering always runs (with or without Home Assistant): the slab never drops below the zone's floor
#     target (setpoint + offset);
#   * zones on "Room sensor" lose their room temperature after ${room_timeout} s; they then heat on floor tempering
#     alone (laminate with the higher offset), which keeps the rooms warm;
#   * floor overheat protection, boiler control, flow temperature (heating curve on the boiler's outdoor sensor,
#     or the fallback outdoor temperature), schedules (DS3231 RTC), pumps, LEDs and the display are all local.
#
# Build / flash:
#   cp secrets.yaml.example secrets.yaml    # Wi-Fi, API key, OTA and fallback AP passwords
#   esphome run heating-controller.yaml     # first flash over USB-C (hold the button = BOOT while plugging in)
#
# Status: written against the v4 schematic; NOT yet tested on real hardware (see docs/open-issues.md).

substitutions:
  name: heating-controller
  friendly_name: Heating controller
  # POSIX or IANA time zone of the installation (schedules run in local time).
  timezone: Europe/Budapest

  # --- Zones -------------------------------------------------------------------------------------------------
  # Names become entity IDs: "Living room" -> climate.heating_controller_living_room.
  zone1_name: Living room
  zone2_name: Hallway
  zone3_name: Bedroom
  zone4_name: Kids room 1
  zone5_name: Kids room 2
  zone6_name: Bathroom
  zone7_name: Zone 7
  zone8_name: Zone 8
  # Home Assistant room temperature sensors (only used with demand source "Room sensor"; a non-existent entity
  # simply reads unknown).
  zone1_room: sensor.living_room_thermostat_local_temperature
  zone2_room: sensor.hallway_thermostat_local_temperature
  zone3_room: sensor.bedroom_thermostat_local_temperature
  zone4_room: sensor.kids_room_1_thermostat_local_temperature
  zone5_room: sensor.kids_room_2_thermostat_local_temperature
  zone6_room: sensor.bathroom_thermostat_local_temperature
  zone7_room: sensor.zone_7_room_temperature
  zone8_room: sensor.zone_8_room_temperature
  # Outdoor temperature from Home Assistant. Fallbacks: the boiler's outdoor sensor (OpenTherm ID 27, if fitted),
  # then fallback_outdoor_temp.
  outdoor_sensor: sensor.outdoor_temperature
  fallback_outdoor_temp: "5.0"
  # Seconds without the Home Assistant API after which HA-supplied temperatures are treated as unknown.
  room_timeout: "300"

  # --- Floor NTC inputs ----------------------------------------------------------------------------------------
  # Divider per input: 3V3 - 10 kΩ 0.1 % - ADS input (10 µF to GND) - NTC - GND.
  # Supply voltage AS SEEN BY EACH ADS1115: read the raw voltage of an unconnected input (open circuit = the 3V3
  # rail measured by the ADS itself) and enter it here; the divider maths is only accurate ratiometrically.
  ntc_supply_voltage_a: 3.30V
  ntc_supply_voltage_b: 3.30V
  ntc_ref_resistor: 10kOhm
  ntc_nominal: 10kOhm
  ntc_b_constant: "3950"
  ntc_open_v: "3.2"
  ntc_short_v: "0.05"

  # --- OLED --------------------------------------------------------------------------------------------------
  oled_rotation: "0"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 600
      then:
        - ds1307.read_time:
            id: rtc_time

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  logs:
    ads1115.sensor: INFO   # 8 NTC channels sample every second
    sensor: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # Never reboot because Home Assistant is away: the controller works on its own.
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Never reboot because Wi-Fi is away (a reboot would briefly close every zone).
  reboot_timeout: 0s
  ap:
    ssid: "Heating Controller Setup"
    password: !secret ap_password

captive_portal:
improv_serial:

web_server:
  port: 80
  version: 3

# --- Buses and chips ----------------------------------------------------------------------------------------

i2c:
  sda: GPIO6
  scl: GPIO7
  frequency: 400kHz
  scan: true

mcp23017:
  - id: mcp_relays   # 0x20: GPA0..7 = Z1..Z8, GPB0..1 = P1..P2 (through ULN2003A)
    address: 0x20
  - id: mcp_io       # 0x21: GPA0..7 = TERM8..TERM1, GPB0..7 = zone LED 1..8
    address: 0x21

ads1115:
  - id: ads_a        # 0x48: A3..A0 = NTC1..NTC4
    address: 0x48
  - id: ads_b        # 0x49: A3..A0 = NTC5..NTC8
    address: 0x49

# OpenTherm master on the power/IO board. ESPHome idles the out pin high; on this board OT_TX high = line low
# (the OpenTherm idle level), so no inversion. OT_RX is low while the boiler draws its high current, while ESPHome
# expects high, hence inverted. Verify on the first prototype (see docs/open-issues.md).
opentherm:
  in_pin:
    number: GPIO11
    inverted: true
  out_pin: GPIO10
  sync_mode: true

time:
  - platform: ds1307   # DS3231M, register compatible
    id: rtc_time
    timezone: ${timezone}
    update_interval: never
    on_time:
      # Weekly pump exercise (Monday 10:00, 1 minute) so pumps do not seize over the summer.
      - seconds: 0
        minutes: 0
        hours: 10
        days_of_week: MON
        then:
          - lambda: "id(pump_exercise_until) = millis() + 60000;"
  - platform: sntp
    id: sntp_time
    timezone: ${timezone}
    on_time_sync:
      then:
        - ds1307.write_time:
            id: rtc_time

# --- Zones --------------------------------------------------------------------------------------------------
# Defaults below are those of the reference installation (see home-assistant/README.md); all of them can be
# changed at run time from Home Assistant or the web UI and are stored in flash.

packages:
  zone1: !include
    file: zone.yaml
    vars: {n: 1, zname: "${zone1_name}", relay_pin: 0, led_pin: 8, term_pin: 7, ads: ads_a, mux: A3_GND,
           vref: "${ntc_supply_voltage_a}", room_sensor: "${zone1_room}", mode: HEAT,
           comfort: "24.0", night: "23.0", boost: "24.0", night_on: RESTORE_DEFAULT_ON, boost_on: RESTORE_DEFAULT_OFF,
           floor_type: Tiles, floor_limit: "28.0"}
  zone2: !include
    file: zone.yaml
    vars: {n: 2, zname: "${zone2_name}", relay_pin: 1, led_pin: 9, term_pin: 6, ads: ads_a, mux: A2_GND,
           vref: "${ntc_supply_voltage_a}", room_sensor: "${zone2_room}", mode: HEAT,
           comfort: "24.0", night: "24.0", boost: "24.0", night_on: RESTORE_DEFAULT_OFF, boost_on: RESTORE_DEFAULT_OFF,
           floor_type: Tiles, floor_limit: "28.0"}
  zone3: !include
    file: zone.yaml
    vars: {n: 3, zname: "${zone3_name}", relay_pin: 2, led_pin: 10, term_pin: 5, ads: ads_a, mux: A1_GND,
           vref: "${ntc_supply_voltage_a}", room_sensor: "${zone3_room}", mode: HEAT,
           comfort: "24.0", night: "24.0", boost: "24.0", night_on: RESTORE_DEFAULT_OFF, boost_on: RESTORE_DEFAULT_OFF,
           floor_type: Laminate, floor_limit: "34.0"}
  zone4: !include
    file: zone.yaml
    vars: {n: 4, zname: "${zone4_name}", relay_pin: 3, led_pin: 11, term_pin: 4, ads: ads_a, mux: A0_GND,
           vref: "${ntc_supply_voltage_a}", room_sensor: "${zone4_room}", mode: HEAT,
           comfort: "23.5", night: "23.0", boost: "23.5", night_on: RESTORE_DEFAULT_ON, boost_on: RESTORE_DEFAULT_OFF,
           floor_type: Laminate, floor_limit: "36.0"}
  zone5: !include
    file: zone.yaml
    vars: {n: 5, zname: "${zone5_name}", relay_pin: 4, led_pin: 12, term_pin: 3, ads: ads_b, mux: A3_GND,
           vref: "${ntc_supply_voltage_b}", room_sensor: "${zone5_room}", mode: HEAT,
           comfort: "23.5", night: "23.0", boost: "23.5", night_on: RESTORE_DEFAULT_ON, boost_on: RESTORE_DEFAULT_OFF,
           floor_type: Laminate, floor_limit: "34.0"}
  zone6: !include
    file: zone.yaml
    vars: {n: 6, zname: "${zone6_name}", relay_pin: 5, led_pin: 13, term_pin: 2, ads: ads_b, mux: A2_GND,
           vref: "${ntc_supply_voltage_b}", room_sensor: "${zone6_room}", mode: HEAT,
           comfort: "23.5", night: "23.0", boost: "24.0", night_on: RESTORE_DEFAULT_ON, boost_on: RESTORE_DEFAULT_ON,
           floor_type: Tiles, floor_limit: "28.0"}
  zone7: !include
    file: zone.yaml
    vars: {n: 7, zname: "${zone7_name}", relay_pin: 6, led_pin: 14, term_pin: 1, ads: ads_b, mux: A1_GND,
           vref: "${ntc_supply_voltage_b}", room_sensor: "${zone7_room}", mode: "OFF",
           comfort: "22.0", night: "20.0", boost: "22.0", night_on: RESTORE_DEFAULT_OFF, boost_on: RESTORE_DEFAULT_OFF,
           floor_type: No probe, floor_limit: "28.0"}
  zone8: !include
    file: zone.yaml
    vars: {n: 8, zname: "${zone8_name}", relay_pin: 7, led_pin: 15, term_pin: 0, ads: ads_b, mux: A0_GND,
           vref: "${ntc_supply_voltage_b}", room_sensor: "${zone8_room}", mode: "OFF",
           comfort: "22.0", night: "20.0", boost: "22.0", night_on: RESTORE_DEFAULT_OFF, boost_on: RESTORE_DEFAULT_OFF,
           floor_type: No probe, floor_limit: "28.0"}

# --- Shared state -------------------------------------------------------------------------------------------

globals:
  - id: ha_offline_s           # seconds since the Home Assistant API was last connected
    type: int
    initial_value: "0"
  - id: zone_on_since          # millis() when each relay last opened
    type: std::array<uint32_t, 8>
  - id: zone_changed           # millis() of each relay's last switch (2-minute guard)
    type: std::array<uint32_t, 8>
  - id: lockout                # floor overheat lockout per zone
    type: std::array<bool, 8>
  - id: floor_tgt              # effective floor target per zone (NaN = no tempering)
    type: std::array<float, 8>
    initial_value: "{NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN}"
  - id: zone_state             # 0 off, 1 idle, 2 heating, 3 floor tempering, 4 lockout, 5 waiting
    type: std::array<uint8_t, 8>
  - id: sched_period           # schedule period last applied: 0 comfort, 1 night, 2 boost, -1 boot, -2 re-apply
    type: std::array<int8_t, 8>
    initial_value: "{-1, -1, -1, -1, -1, -1, -1, -1}"
  - id: in_night_window
    type: bool
    initial_value: "false"
  - id: flow_integral          # sustained-deficit term (°C)
    type: float
    initial_value: "0"
  - id: flow_integral_step     # millis() of the last integral step
    type: uint32_t
    initial_value: "0"
  - id: outdoor_hist           # outdoor temperature every 10 min, last 2 h (13 samples)
    type: std::array<float, 13>
    initial_value: "{NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN}"
  - id: outdoor_hist_tick
    type: int
    initial_value: "0"
  - id: preheat_active
    type: bool
    initial_value: "false"
  - id: preheat_calm_since     # millis() since the outdoor temperature stopped falling fast (0 = falling)
    type: uint32_t
    initial_value: "0"
  - id: pump_idle_since        # millis() since the last zone closed, per pump (0 = a zone is open)
    type: std::array<uint32_t, 2>
  - id: pump_exercise_until
    type: uint32_t
    initial_value: "0"
  - id: display_page           # 0 = boiler, 1..8 = zones
    type: int
    initial_value: "0"
  - id: display_hold_until
    type: uint32_t
    initial_value: "0"

# --- Relays, LEDs and button that are not per zone -------------------------------------------------------------

switch:
  - platform: gpio
    id: pump1_relay
    internal: true   # owned by the control loop; see the "Pump 1" binary sensor and "Pump 1 mode"
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: mcp_relays
      number: 8
      mode:
        output: true
    on_turn_on:
      - switch.turn_on: pump1_led
    on_turn_off:
      - switch.turn_off: pump1_led
  - platform: gpio
    id: pump2_relay
    internal: true   # owned by the control loop; see the "Pump 2" binary sensor and "Pump 2 mode"
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: mcp_relays
      number: 9
      mode:
        output: true
    on_turn_on:
      - switch.turn_on: pump2_led
    on_turn_off:
      - switch.turn_off: pump2_led
  - platform: gpio
    id: pump1_led
    internal: true
    pin: GPIO18
  - platform: gpio
    id: pump2_led
    internal: true
    pin: GPIO19
  - platform: gpio
    id: status_led
    internal: true
    pin: GPIO20

  # OpenTherm: CH demand is owned by the control loop (internal); hot water is the user's choice.
  - platform: opentherm
    ch_enable:
      id: ot_ch
      internal: true
      restore_mode: ALWAYS_OFF
    dhw_enable:
      name: "Hot water"
      restore_mode: RESTORE_DEFAULT_ON

  - platform: restart
    name: "Restart"
    entity_category: config

binary_sensor:
  - platform: gpio
    id: button
    pin:
      number: GPIO9
      inverted: true
      ignore_strapping_warning: true   # IO9 is BOOT; a 10 kΩ pull-up is on the board
    internal: true
    filters:
      - delayed_on: 30ms
    on_press:
      - lambda: |-
          id(display_hold_until) = millis() + 30000;
          id(display_page) = (id(display_page) + 1) % 9;

  - platform: opentherm
    flame_on:
      id: ot_flame
      name: "Boiler flame"
    ch_active:
      name: "Boiler heating"
    dhw_active:
      id: ot_dhw_active
      name: "Boiler hot water"
    fault_indication:
      id: ot_fault
      name: "Boiler fault"

  - platform: template
    name: "Boiler heating demand"
    device_class: heat
    lambda: "return id(ot_ch).state;"

  - platform: template
    name: "Evening preheat"
    icon: mdi:weather-sunset-down
    lambda: "return id(preheat_active);"

  - platform: template
    name: "Pump 1"
    device_class: running
    lambda: "return id(pump1_relay).state;"
  - platform: template
    name: "Pump 2"
    device_class: running
    lambda: "return id(pump2_relay).state;"

  - platform: status
    name: "Status"

# --- Boiler, outdoor and flow sensors -----------------------------------------------------------------------

number:
  - platform: opentherm
    t_set:
      id: ot_t_set
      internal: true
      min_value: 20
      max_value: 60
      step: 0.5
      initial_value: 30
      restore_value: true

  # Heating curve: flow = ref + offset + slope × (ref − outdoor), clamped to curve min/max. The defaults were
  # tuned on a poorly insulated building (outdoor 16 °C -> 34.6, 0 °C -> 41.8); a well-insulated building needs a
  # lower offset and slope. Many boilers still cap the flow at their front-panel knob: set it to the top of this
  # range.
  - platform: template
    id: curve_ref
    name: "Curve reference room temperature"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 15
    max_value: 28
    step: 0.5
    initial_value: 24
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: curve_slope
    name: "Curve slope"
    entity_category: config
    min_value: 0.1
    max_value: 3.0
    step: 0.05
    initial_value: 0.45
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: curve_offset
    name: "Curve offset"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: -10
    max_value: 20
    step: 0.5
    initial_value: 7
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: curve_min
    name: "Curve minimum"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 50
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: curve_max
    name: "Curve maximum"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 25
    max_value: 60
    step: 1
    initial_value: 42
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: flow_max
    name: "Flow maximum"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 25
    max_value: 60
    step: 1
    initial_value: 45
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: boost_max
    name: "Demand boost maximum"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 15
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: flow_manual
    name: "Manual flow setpoint"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 60
    step: 0.5
    initial_value: 35
    optimistic: true
    restore_value: true
    mode: box

  # Floor tempering
  - platform: template
    id: floor_offset_tiles
    name: "Floor offset tiles"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 6
    step: 0.5
    initial_value: 2
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: floor_offset_laminate
    name: "Floor offset laminate"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 8
    step: 0.5
    initial_value: 3
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: night_floor_target
    name: "Night floor target"
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 18
    max_value: 30
    step: 0.5
    initial_value: 25
    optimistic: true
    restore_value: true
    mode: box

  - platform: template
    id: pump_overrun
    name: "Pump overrun"
    entity_category: config
    unit_of_measurement: "min"
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    mode: box

select:
  - platform: template
    id: heating_mode
    name: "Heating mode"
    icon: mdi:radiator
    optimistic: true
    restore_value: true
    # Off (summer): every zone closed, no CH demand; hot water and the weekly pump exercise keep working.
    options: ["Auto", "Off"]
    initial_option: "Auto"
  - platform: template
    id: flow_mode
    name: "Flow mode"
    icon: mdi:thermometer-water
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["Auto", "Manual"]
    initial_option: "Auto"
  - platform: template
    id: pump1_mode
    name: "Pump 1 mode"
    icon: mdi:pump
    entity_category: config
    optimistic: true
    restore_value: true
    # Auto: runs while any zone is open, plus the overrun. Off by default: most systems need no extra pump
    # (the boiler pump circulates); set Auto for a mixing station or secondary circuit.
    options: ["Auto", "On", "Off"]
    initial_option: "Off"
  - platform: template
    id: pump2_mode
    name: "Pump 2 mode"
    icon: mdi:pump
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["Auto", "On", "Off"]
    initial_option: "Off"

datetime:
  # Schedule: night window night_start -> day_start (zones with "night setback" on), evening boost window
  # boost_start -> boost_end (zones with "evening boost" on), comfort otherwise. day_start is when rooms switch back
  # to comfort: set it early enough that the slow floor reaches comfort BY the time you get up (default 05:00 for
  # 07:00). A manual setpoint change holds until the next schedule change.
  - platform: template
    id: sched_day_start
    name: "Schedule day start"
    type: time
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "05:00:00"
    on_value:
      - lambda: "id(sched_period).fill(-2);"
  - platform: template
    id: sched_night_start
    name: "Schedule night start"
    type: time
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "23:00:00"
    on_value:
      - lambda: "id(sched_period).fill(-2);"
  - platform: template
    id: sched_boost_start
    name: "Schedule boost start"
    type: time
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "17:30:00"
    on_value:
      - lambda: "id(sched_period).fill(-2);"
  - platform: template
    id: sched_boost_end
    name: "Schedule boost end"
    type: time
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "20:00:00"
    on_value:
      - lambda: "id(sched_period).fill(-2);"

sensor:
  - platform: opentherm
    t_boiler:
      id: ot_flow
      name: "Boiler flow temperature"
    t_ret:
      id: ot_return
      name: "Boiler return temperature"
    t_dhw:
      name: "Hot water temperature"
    t_outside:
      id: ot_outside
      name: "Boiler outdoor temperature"
    rel_mod_level:
      name: "Boiler modulation"
    ch_pressure:
      name: "Heating water pressure"
    oem_fault_code:
      name: "Boiler fault code"

  - platform: homeassistant
    id: outdoor_ha
    entity_id: ${outdoor_sensor}
    internal: true
  - platform: template
    id: outdoor_temp
    name: "Outdoor temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      if (id(ha_offline_s) < ${room_timeout} && !std::isnan(id(outdoor_ha).state)) return id(outdoor_ha).state;
      return id(ot_outside).state;   // NaN if the boiler has no outdoor sensor

  - platform: template
    id: flow_calc
    name: "Calculated flow temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    name: "Flow setpoint"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: "return id(ot_t_set).state;"
  - platform: template
    name: "Flow sustained-deficit boost"
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: 60s
    lambda: "return id(flow_integral);"

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: version
    name: "Firmware"
  - platform: wifi_info
    ip_address:
      name: "IP address"

# --- Control loop -------------------------------------------------------------------------------------------

interval:
  # Home Assistant connection watchdog (for the room/outdoor temperature timeout).
  - interval: 10s
    then:
      - if:
          condition:
            api.connected:
          then:
            - lambda: "id(ha_offline_s) = 0;"
          else:
            - lambda: "if (id(ha_offline_s) < 1000000) id(ha_offline_s) += 10;"

  # Zones, floor protection, boiler CH demand and pumps.
  - interval: 10s
    then:
      - lambda: |-
          climate::Climate *cl[8] = {id(zone1_climate), id(zone2_climate), id(zone3_climate), id(zone4_climate),
                                     id(zone5_climate), id(zone6_climate), id(zone7_climate), id(zone8_climate)};
          sensor::Sensor *room[8] = {id(zone1_room), id(zone2_room), id(zone3_room), id(zone4_room),
                                     id(zone5_room), id(zone6_room), id(zone7_room), id(zone8_room)};
          sensor::Sensor *flr[8] = {id(zone1_floor), id(zone2_floor), id(zone3_floor), id(zone4_floor),
                                    id(zone5_floor), id(zone6_floor), id(zone7_floor), id(zone8_floor)};
          binary_sensor::BinarySensor *wired[8] = {id(zone1_wired), id(zone2_wired), id(zone3_wired), id(zone4_wired),
                                                   id(zone5_wired), id(zone6_wired), id(zone7_wired), id(zone8_wired)};
          switch_::Switch *relay[8] = {id(zone1_relay), id(zone2_relay), id(zone3_relay), id(zone4_relay),
                                       id(zone5_relay), id(zone6_relay), id(zone7_relay), id(zone8_relay)};
          select::Select *src[8] = {id(zone1_source), id(zone2_source), id(zone3_source), id(zone4_source),
                                    id(zone5_source), id(zone6_source), id(zone7_source), id(zone8_source)};
          select::Select *ftype[8] = {id(zone1_floor_type), id(zone2_floor_type), id(zone3_floor_type),
                                      id(zone4_floor_type), id(zone5_floor_type), id(zone6_floor_type),
                                      id(zone7_floor_type), id(zone8_floor_type)};
          number::Number *limit[8] = {id(zone1_limit), id(zone2_limit), id(zone3_limit), id(zone4_limit),
                                      id(zone5_limit), id(zone6_limit), id(zone7_limit), id(zone8_limit)};
          switch_::Switch *night_on[8] = {id(zone1_night_on), id(zone2_night_on), id(zone3_night_on),
                                          id(zone4_night_on), id(zone5_night_on), id(zone6_night_on),
                                          id(zone7_night_on), id(zone8_night_on)};

          const bool heating_on = id(heating_mode).active_index().value_or(0) == 0;
          const float tile_off = id(floor_offset_tiles).state;
          const float lam_off = id(floor_offset_laminate).state;
          const float night_floor = id(night_floor_target).state;
          const uint32_t now = millis();

          for (int i = 0; i < 8; i++) {
            const float f = flr[i]->state;          // floor
            const float a = room[i]->state;         // room air (NaN without Home Assistant)
            const float t = cl[i]->target_temperature;
            const int ft = ftype[i]->active_index().value_or(2);   // 0 tiles, 1 laminate, 2 no probe
            const int s = src[i]->active_index().value_or(0);      // 0 room sensor, 1 wired, 2 floor only
            const bool probe = ft != 2;

            // Floor overheat lockout: on at the limit, off 2 °C below. A probe that becomes unknown keeps the
            // current state (fail-safe direction).
            if (!probe) {
              id(lockout)[i] = false;
            } else if (!std::isnan(f)) {
              const float lim = limit[i]->state;
              if (!id(lockout)[i] && f >= lim) {
                id(lockout)[i] = true;
                ESP_LOGW("zone", "Zone %d floor %.1f °C >= limit %.1f °C: locked out", i + 1, f, lim);
              } else if (id(lockout)[i] && f <= lim - 2.0f) {
                id(lockout)[i] = false;
                ESP_LOGW("zone", "Zone %d floor %.1f °C: lockout released", i + 1, f);
              }
            }

            // Floor target ("never let the slab go cold"): setpoint + offset, the night floor target during the
            // night window for zones with night setback. Laminate gets the higher offset until the room is
            // 0.3 °C above setpoint, and also whenever the room temperature is unknown (no Home Assistant).
            float tgt = NAN;
            if (probe && !std::isnan(t)) {
              if (id(in_night_window) && night_on[i]->state) tgt = night_floor;
              else if (ft == 0) tgt = t + tile_off;
              else tgt = (std::isnan(a) || a < t + 0.3f) ? t + lam_off : t + tile_off;
            }
            id(floor_tgt)[i] = tgt;

            const bool zone_on = heating_on && cl[i]->mode != climate::CLIMATE_MODE_OFF;
            // floor demand, 0.3 °C hysteresis
            const bool fd = zone_on && !std::isnan(tgt) && !std::isnan(f) &&
                            f < tgt - (relay[i]->state ? 0.0f : 0.3f);
            // room demand from the selected source
            bool rd = false;
            if (zone_on && s == 0) rd = cl[i]->action == climate::CLIMATE_ACTION_HEATING;
            if (zone_on && s == 1) rd = wired[i]->state;

            const bool want = (rd || fd) && !id(lockout)[i];
            uint8_t st = !zone_on ? 0 : id(lockout)[i] ? 4 : rd ? 2 : fd ? 3 : 1;
            if (want != relay[i]->state) {
              // A relay switches at most every 2 minutes; closing for a lockout or "off" is immediate.
              const bool urgent = !want && (id(lockout)[i] || !zone_on);
              if (urgent || id(zone_changed)[i] == 0 || now - id(zone_changed)[i] >= 120000) {
                if (want) relay[i]->turn_on(); else relay[i]->turn_off();
                id(zone_changed)[i] = now;
              } else {
                st = 5;
              }
            }
            id(zone_state)[i] = st;
          }

          // Boiler CH demand: on once a zone has been open for 1 minute (thermal actuators are open by then),
          // off as soon as no zone is open, so the boiler pump never runs against closed valves.
          bool any_open = false, any_open_60 = false;
          for (int i = 0; i < 8; i++) {
            if (!relay[i]->state) continue;
            any_open = true;
            if (now - id(zone_on_since)[i] >= 60000) any_open_60 = true;
          }
          if (!any_open && id(ot_ch).state) id(ot_ch).turn_off();
          else if (any_open_60 && heating_on && !id(ot_ch).state) id(ot_ch).turn_on();

          // Pumps: Auto = run while any zone is open + overrun; weekly exercise; On / Off = forced.
          const bool exercise = (int32_t) (id(pump_exercise_until) - now) > 0;
          const uint32_t overrun = (uint32_t) id(pump_overrun).state * 60000;
          switch_::Switch *pump[2] = {id(pump1_relay), id(pump2_relay)};
          select::Select *pmode[2] = {id(pump1_mode), id(pump2_mode)};
          for (int p = 0; p < 2; p++) {
            const int m = pmode[p]->active_index().value_or(2);
            bool run;
            if (m == 1) run = true;
            else if (m == 2) run = false;
            else if (any_open) { run = true; id(pump_idle_since)[p] = 0; }
            else {
              if (id(pump_idle_since)[p] == 0) id(pump_idle_since)[p] = now;
              run = pump[p]->state && now - id(pump_idle_since)[p] < overrun;
            }
            if (m != 2 && exercise) run = true;
            if (run != pump[p]->state) { if (run) pump[p]->turn_on(); else pump[p]->turn_off(); }
          }

  # Weather-compensated flow temperature -> boiler.
  - interval: 60s
    then:
      - lambda: |-
          climate::Climate *cl[8] = {id(zone1_climate), id(zone2_climate), id(zone3_climate), id(zone4_climate),
                                     id(zone5_climate), id(zone6_climate), id(zone7_climate), id(zone8_climate)};
          sensor::Sensor *room[8] = {id(zone1_room), id(zone2_room), id(zone3_room), id(zone4_room),
                                     id(zone5_room), id(zone6_room), id(zone7_room), id(zone8_room)};
          select::Select *src[8] = {id(zone1_source), id(zone2_source), id(zone3_source), id(zone4_source),
                                    id(zone5_source), id(zone6_source), id(zone7_source), id(zone8_source)};
          const uint32_t now = millis();
          const bool heating_on = id(heating_mode).active_index().value_or(0) == 0;

          // Outdoor: Home Assistant -> boiler sensor -> fallback.
          const float out_meas = id(outdoor_temp).state;
          const float out = std::isnan(out_meas) ? ${fallback_outdoor_temp} : out_meas;

          // Heating curve
          const float ref = id(curve_ref).state;
          float base = ref + id(curve_offset).state + id(curve_slope).state * (ref - out);
          base = std::max(id(curve_min).state, std::min(id(curve_max).state, base));

          // Demand boost: largest deficit (setpoint - room) of the zones on "Room sensor" that are heating and not
          // locked out: (deficit - 0.3) × 5, capped. Below 0.3 °C nothing is added, so thermostat noise cannot
          // make the flow target flap. Without room temperatures (no Home Assistant) there is no boost.
          float dev = -99.0f;
          bool any_valid = false;
          for (int i = 0; i < 8; i++) {
            if (!heating_on || cl[i]->mode == climate::CLIMATE_MODE_OFF) continue;
            if (src[i]->active_index().value_or(0) != 0 || id(lockout)[i]) continue;
            const float a = room[i]->state, t = cl[i]->target_temperature;
            if (std::isnan(a) || std::isnan(t)) continue;
            any_valid = true;
            dev = std::max(dev, t - a);
          }
          const float boost = any_valid ? std::max(0.0f, std::min(id(boost_max).state, (dev - 0.3f) * 5.0f)) : 0.0f;

          // Sustained-deficit term: +1 °C every 30 min (max +8) while a room stays > 0.3 °C below target, reset
          // once every room has reached it. Without it curve + boost settle with a ~1 °C permanent deficit.
          if (!any_valid || dev <= 0.0f) {
            id(flow_integral) = 0;
            id(flow_integral_step) = now;
          } else if (now - id(flow_integral_step) >= 30 * 60000) {
            id(flow_integral_step) = now;
            if (dev > 0.3f && id(flow_integral) < 8.0f) id(flow_integral) += 1.0f;
          }

          // Evening preheat: outdoor temperature fell >= 3 °C in 2 h between 16:00 and 23:00 -> +2 °C until it
          // has been calm for 30 min. Uses measured values only.
          if (++id(outdoor_hist_tick) >= 10) {
            id(outdoor_hist_tick) = 0;
            auto &h = id(outdoor_hist);
            for (int k = 0; k < 12; k++) h[k] = h[k + 1];
            h[12] = out_meas;
          }
          const auto &h = id(outdoor_hist);
          const bool falling = !std::isnan(h[0]) && !std::isnan(h[12]) && h[12] - h[0] <= -3.0f;
          const auto t_now = id(rtc_time).now();
          const bool evening = t_now.is_valid() && t_now.hour >= 16 && t_now.hour < 23;
          if (falling) {
            id(preheat_calm_since) = 0;
            if (evening && !id(preheat_active)) {
              id(preheat_active) = true;
              ESP_LOGI("flow", "Fast outdoor temperature drop: evening preheat on");
            }
          } else if (id(preheat_active)) {
            if (id(preheat_calm_since) == 0) id(preheat_calm_since) = now;
            if (now - id(preheat_calm_since) >= 30 * 60000) id(preheat_active) = false;
          }

          const float calc = std::min(id(flow_max).state,
                                      base + boost + id(flow_integral) + (id(preheat_active) ? 2.0f : 0.0f));
          id(flow_calc).publish_state(calc);

          // Write to the boiler: Auto = calculated value in 0.5 °C steps, only on a change of >= 1 °C (smaller
          // changes would follow thermostat noise); Manual = the manual setpoint.
          const bool manual = id(flow_mode).active_index().value_or(0) == 1;
          const float want = manual ? id(flow_manual).state : std::round(calc * 2.0f) / 2.0f;
          const float cur = id(ot_t_set).state;
          if (std::isnan(cur) || std::fabs(want - cur) >= (manual ? 0.5f : 1.0f)) {
            auto call = id(ot_t_set).make_call();
            call.set_value(want);
            call.perform();
          }

  # Schedule: applies comfort / night / boost setpoints when the period changes. After a reboot the restored
  # setpoints are kept until the next change.
  - interval: 30s
    then:
      - lambda: |-
          const auto t = id(rtc_time).now();
          if (!t.is_valid()) return;
          climate::Climate *cl[8] = {id(zone1_climate), id(zone2_climate), id(zone3_climate), id(zone4_climate),
                                     id(zone5_climate), id(zone6_climate), id(zone7_climate), id(zone8_climate)};
          switch_::Switch *night_on[8] = {id(zone1_night_on), id(zone2_night_on), id(zone3_night_on),
                                          id(zone4_night_on), id(zone5_night_on), id(zone6_night_on),
                                          id(zone7_night_on), id(zone8_night_on)};
          switch_::Switch *boost_on[8] = {id(zone1_boost_on), id(zone2_boost_on), id(zone3_boost_on),
                                          id(zone4_boost_on), id(zone5_boost_on), id(zone6_boost_on),
                                          id(zone7_boost_on), id(zone8_boost_on)};
          number::Number *comfort[8] = {id(zone1_comfort), id(zone2_comfort), id(zone3_comfort), id(zone4_comfort),
                                        id(zone5_comfort), id(zone6_comfort), id(zone7_comfort), id(zone8_comfort)};
          number::Number *night_t[8] = {id(zone1_night), id(zone2_night), id(zone3_night), id(zone4_night),
                                        id(zone5_night), id(zone6_night), id(zone7_night), id(zone8_night)};
          number::Number *boost_t[8] = {id(zone1_boost), id(zone2_boost), id(zone3_boost), id(zone4_boost),
                                        id(zone5_boost), id(zone6_boost), id(zone7_boost), id(zone8_boost)};

          auto mins = [](datetime::TimeEntity *e) { return e->hour * 60 + e->minute; };
          auto inside = [](int m, int a, int b) { return a <= b ? (m >= a && m < b) : (m >= a || m < b); };
          const int m = t.hour * 60 + t.minute;
          const bool night = inside(m, mins(id(sched_night_start)), mins(id(sched_day_start)));
          const bool boost = inside(m, mins(id(sched_boost_start)), mins(id(sched_boost_end)));
          id(in_night_window) = night;

          for (int i = 0; i < 8; i++) {
            const int8_t p = (night && night_on[i]->state) ? 1 : (boost && boost_on[i]->state) ? 2 : 0;
            if (id(sched_period)[i] == -1) { id(sched_period)[i] = p; continue; }
            if (p == id(sched_period)[i]) continue;
            id(sched_period)[i] = p;
            const float sp = p == 1 ? night_t[i]->state : p == 2 ? boost_t[i]->state : comfort[i]->state;
            if (std::isnan(sp)) continue;
            auto call = cl[i]->make_call();
            call.set_target_temperature(sp);
            call.perform();
            ESP_LOGI("schedule", "Zone %d -> %.1f °C", i + 1, sp);
          }

  # Status LED: steady = OK, slow blink = no Home Assistant, fast blink = floor lockout or boiler fault.
  - interval: 250ms
    then:
      - lambda: |-
          static uint8_t tick = 0;
          tick++;
          bool fault = id(ot_fault).state;
          for (int i = 0; i < 8; i++) fault |= id(lockout)[i];
          bool on;
          if (fault) on = tick & 1;
          else if (id(ha_offline_s) >= 60) on = (tick & 7) < 4;
          else on = true;
          if (on != id(status_led).state) { if (on) id(status_led).turn_on(); else id(status_led).turn_off(); }

  # Display page rotation (every 5 s, skipping zones that are off; the button holds a page for 30 s).
  - interval: 5s
    then:
      - lambda: |-
          if ((int32_t) (id(display_hold_until) - millis()) > 0) return;
          climate::Climate *cl[8] = {id(zone1_climate), id(zone2_climate), id(zone3_climate), id(zone4_climate),
                                     id(zone5_climate), id(zone6_climate), id(zone7_climate), id(zone8_climate)};
          int p = id(display_page);
          for (int k = 0; k < 9; k++) {
            p = (p + 1) % 9;
            if (p == 0 || cl[p - 1]->mode != climate::CLIMATE_MODE_OFF) break;
          }
          id(display_page) = p;

# --- Display ------------------------------------------------------------------------------------------------

font:
  - file: "gfonts://Roboto Condensed"
    id: font_s
    size: 14
    glyphsets: [GF_Latin_Core]

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x32"
    address: 0x3C
    rotation: ${oled_rotation}
    update_interval: 1s
    lambda: |-
      static const char *const names[8] = {"${zone1_name}", "${zone2_name}", "${zone3_name}", "${zone4_name}",
                                           "${zone5_name}", "${zone6_name}", "${zone7_name}", "${zone8_name}"};
      static const char *const states[6] = {"off", "idle", "HEAT", "TEMPER", "LOCK", "wait"};
      const int p = id(display_page);
      if (p == 0) {
        const auto t = id(rtc_time).now();
        if (t.is_valid()) it.strftime(0, 0, id(font_s), "%H:%M", t);
        const float o = id(outdoor_temp).state;
        if (!std::isnan(o)) it.printf(127, 0, id(font_s), TextAlign::TOP_RIGHT, "out %.1f°", o);
        it.printf(0, 16, id(font_s), "flow %.0f° / %.0f°", id(ot_flow).state, id(ot_t_set).state);
        it.print(127, 16, id(font_s), TextAlign::TOP_RIGHT,
                 id(ot_dhw_active).state ? "DHW" : id(ot_flame).state ? "FLAME" : "");
        return;
      }
      climate::Climate *cl[8] = {id(zone1_climate), id(zone2_climate), id(zone3_climate), id(zone4_climate),
                                 id(zone5_climate), id(zone6_climate), id(zone7_climate), id(zone8_climate)};
      sensor::Sensor *flr[8] = {id(zone1_floor), id(zone2_floor), id(zone3_floor), id(zone4_floor),
                                id(zone5_floor), id(zone6_floor), id(zone7_floor), id(zone8_floor)};
      const int i = p - 1;
      it.printf(0, 0, id(font_s), "%d %s", p, names[i]);
      it.print(127, 0, id(font_s), TextAlign::TOP_RIGHT, states[id(zone_state)[i]]);
      const float a = cl[i]->current_temperature, f = flr[i]->state;
      char room_s[12], floor_s[12];
      if (std::isnan(a)) snprintf(room_s, sizeof(room_s), "--"); else snprintf(room_s, sizeof(room_s), "%.1f", a);
      if (std::isnan(f)) snprintf(floor_s, sizeof(floor_s), "--"); else snprintf(floor_s, sizeof(floor_s), "%.1f", f);
      it.printf(0, 16, id(font_s), "%s/%.1f°  floor %s°", room_s, cl[i]->target_temperature, floor_s);
