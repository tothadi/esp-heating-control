<text x="30" y="64" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#555">The master supplies the line voltage (high 15–18 V, low &lt; 7 V); the boiler answers with its current draw (5–7 / 17–23 mA).</text>
