<text x="55" y="740" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222">High (TX = 0): ≈ 17.5 V at 7 mA, ≈ 16.4 V at 23 mA   (spec: 15–18 V)</text>
<text x="55" y="762" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Low (TX = 1): ≈ 2.9 V   (spec: &lt; 7 V)</text>
<text x="55" y="784" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Receive threshold: 0.6 V / 47 Ω ≈ 12.8 mA   (boiler: 5–7 / 17–23 mA)</text>
<text x="55" y="806" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222">Short circuit: R55 15 Ω + Q2 → ≈ 43 mA; Q1 SOT-89 (1 W)</text>
<text x="55" y="828" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#222">R52 at low level: (24 − 4.4) V / 2.2 kΩ ≈ 9 mA → 0.17 W, hence 1206</text>
<text x="55" y="850" font-family="Helvetica,Arial,sans-serif" font-size="13" text-anchor="start" font-weight="normal" fill="#555">Firmware: OT_TX/OT_RX polarity can be set in ESPHome with the `inverted:` option.</text>
