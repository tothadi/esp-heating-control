                name: Night
              - entity: switch.heating_controller_bathroom_evening_boost
                name: Evening boost
              - entity: number.heating_controller_bathroom_boost_temperature
                name: Boost

  - title: Settings
    path: settings
    icon: mdi:tune
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Zones
            icon: mdi:floor-plan
          - type: markdown
            content: >-
              **Demand source**: *Room sensor* = the controller's thermostat with the Home Assistant room
              temperature (without Home Assistant only floor tempering remains); *Wired thermostat* = the TERM
              input; *Floor only* = tempering only. **Floor type** sets the floor target offset; *No probe*
              disables tempering and floor protection. The **floor limit** closes the zone (released 2 °C below).
            grid_options: { columns: 12 }
          - type: entities
            title: "Living room"
            show_header_toggle: false
            grid_options: { columns: 6 }
            entities:
              - entity: select.heating_controller_living_room_demand_source
                name: Demand source
              - entity: binary_sensor.heating_controller_living_room_wired_thermostat
                name: Wired thermostat
              - entity: select.heating_controller_living_room_floor_type
                name: Floor type
              - entity: number.heating_controller_living_room_floor_limit
                name: Floor limit
              - entity: binary_sensor.heating_controller_living_room_floor_overheat
                name: Floor overheat
          - type: entities
            title: "Hallway"
            show_header_toggle: false
            grid_options: { columns: 6 }
            entities:
              - entity: select.heating_controller_hallway_demand_source
                name: Demand source
              - entity: binary_sensor.heating_controller_hallway_wired_thermostat
                name: Wired thermostat
              - entity: select.heating_controller_hallway_floor_type
                name: Floor type
              - entity: number.heating_controller_hallway_floor_limit
                name: Floor limit
              - entity: binary_sensor.heating_controller_hallway_floor_overheat
                name: Floor overheat
          - type: entities
            title: "Bedroom"
            show_header_toggle: false
            grid_options: { columns: 6 }
            entities:
              - entity: select.heating_controller_bedroom_demand_source
                name: Demand source
              - entity: binary_sensor.heating_controller_bedroom_wired_thermostat
                name: Wired thermostat
              - entity: select.heating_controller_bedroom_floor_type
                name: Floor type
              - entity: number.heating_controller_bedroom_floor_limit
                name: Floor limit
              - entity: binary_sensor.heating_controller_bedroom_floor_overheat
                name: Floor overheat
          - type: entities
            title: "Kids room 1"
            show_header_toggle: false
            grid_options: { columns: 6 }
            entities:
              - entity: select.heating_controller_kids_room_1_demand_source
                name: Demand source
              - entity: binary_sensor.heating_controller_kids_room_1_wired_thermostat
                name: Wired thermostat
              - entity: select.heating_controller_kids_room_1_floor_type
                name: Floor type
              - entity: number.heating_controller_kids_room_1_floor_limit
                name: Floor limit
              - entity: binary_sensor.heating_controller_kids_room_1_floor_overheat
                name: Floor overheat
          - type: entities
            title: "Kids room 2"
            show_header_toggle: false
            grid_options: { columns: 6 }
            entities:
              - entity: select.heating_controller_kids_room_2_demand_source
                name: Demand source
              - entity: binary_sensor.heating_controller_kids_room_2_wired_thermostat
                name: Wired thermostat
              - entity: select.heating_controller_kids_room_2_floor_type
                name: Floor type
              - entity: number.heating_controller_kids_room_2_floor_limit
                name: Floor limit
              - entity: binary_sensor.heating_controller_kids_room_2_floor_overheat
                name: Floor overheat
          - type: entities
            title: "Bathroom"
            show_header_toggle: false
            grid_options: { columns: 6 }
            entities:
              - entity: select.heating_controller_bathroom_demand_source
                name: Demand source
              - entity: binary_sensor.heating_controller_bathroom_wired_thermostat
                name: Wired thermostat
              - entity: select.heating_controller_bathroom_floor_type
                name: Floor type
              - entity: number.heating_controller_bathroom_floor_limit
                name: Floor limit
              - entity: binary_sensor.heating_controller_bathroom_floor_overheat
                name: Floor overheat
      - type: grid
        cards:
          - type: heading
            heading: Flow temperature
            icon: mdi:chart-bell-curve
          - type: markdown
            content: >-
              flow = reference + offset + slope × (reference − outdoor), clamped to curve min/max, plus the demand
              boost (largest room deficit) and the sustained-deficit term, capped at the flow maximum. Outdoor
              temperature: Home Assistant, else the boiler's outdoor sensor, else a fixed fallback.
            grid_options: { columns: 12 }
          - type: entities
            show_header_toggle: false
            grid_options: { columns: 12 }
            entities:
              - entity: select.heating_controller_flow_mode
                name: Flow mode
              - entity: number.heating_controller_manual_flow_setpoint
                name: Manual flow setpoint
              - entity: number.heating_controller_curve_reference_room_temperature
                name: Reference room temperature
              - entity: number.heating_controller_curve_slope
                name: Slope
              - entity: number.heating_controller_curve_offset
                name: Offset
              - entity: number.heating_controller_curve_minimum
                name: Curve minimum
              - entity: number.heating_controller_curve_maximum
                name: Curve maximum
              - entity: number.heating_controller_demand_boost_maximum
                name: Demand boost maximum
              - entity: number.heating_controller_flow_maximum
                name: Flow maximum
          - type: heading
            heading: Floor and pumps
            icon: mdi:pump
          - type: entities
            show_header_toggle: false
            grid_options: { columns: 12 }
            entities:
              - entity: number.heating_controller_floor_offset_tiles
                name: Floor offset tiles
              - entity: number.heating_controller_floor_offset_laminate
                name: Floor offset laminate
              - entity: select.heating_controller_pump_1_mode
                name: Pump 1 mode
              - entity: select.heating_controller_pump_2_mode
                name: Pump 2 mode
              - entity: number.heating_controller_pump_overrun
                name: Pump overrun

  - title: System
    path: system
    icon: mdi:chip
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Controller
            icon: mdi:chip
          - type: tile
            entity: binary_sensor.heating_controller_status
            name: Connection
          - type: tile
            entity: sensor.heating_controller_wifi_signal
            name: WiFi signal
          - type: tile
            entity: sensor.heating_controller_uptime
            name: Uptime
          - type: tile
            entity: sensor.heating_controller_firmware
            name: Firmware
          - type: tile
            entity: sensor.heating_controller_ip_address
            name: IP address
          - type: tile
            entity: button.heating_controller_restart
            name: Restart
          - type: tile
            entity: sensor.heating_controller_boiler_outdoor_temperature
            name: Boiler outdoor sensor
