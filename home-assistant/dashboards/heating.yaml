# Home Assistant dashboard for the ESP Heating Control controller (storage-mode dashboard).
# Install: Settings -> Dashboards -> Add dashboard -> open it -> pencil -> three-dot menu -> Raw configuration
#          editor -> paste this file.
# Every entity here belongs to the controller (ESPHome device "heating-controller"); the controller runs all the
# control logic, this dashboard only shows it and changes its setpoints and settings.
# Zones 1-6 are listed with the reference names. If you rename zones in the firmware (zoneN_name), replace the
# entity IDs here; add zones 7-8 by copying a zone block.
title: Heating
views:
  - title: Overview
    path: overview
    icon: mdi:radiator
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Rooms
            icon: mdi:home-thermometer
          - type: vertical-stack
            grid_options: { columns: 6 }
            cards:
              - type: thermostat
                entity: climate.heating_controller_living_room
                name: "Living room"
              - type: glance
                show_icon: false
                entities:
                  - entity: sensor.heating_controller_living_room_floor_temperature
                    name: Floor
                  - entity: sensor.heating_controller_living_room_floor_target
                    name: Floor target
                  - entity: binary_sensor.heating_controller_living_room_valve
                    name: Valve
              - type: tile
                entity: sensor.heating_controller_living_room_state
                name: State
          - type: vertical-stack
            grid_options: { columns: 6 }
            cards:
              - type: thermostat
                entity: climate.heating_controller_hallway
                name: "Hallway"
              - type: glance
                show_icon: false
                entities:
                  - entity: sensor.heating_controller_hallway_floor_temperature
                    name: Floor
                  - entity: sensor.heating_controller_hallway_floor_target
                    name: Floor target
                  - entity: binary_sensor.heating_controller_hallway_valve
                    name: Valve
              - type: tile
                entity: sensor.heating_controller_hallway_state
                name: State
          - type: vertical-stack
            grid_options: { columns: 6 }
            cards:
              - type: thermostat
                entity: climate.heating_controller_bedroom
                name: "Bedroom"
              - type: glance
                show_icon: false
                entities:
                  - entity: sensor.heating_controller_bedroom_floor_temperature
                    name: Floor
                  - entity: sensor.heating_controller_bedroom_floor_target
                    name: Floor target
                  - entity: binary_sensor.heating_controller_bedroom_valve
                    name: Valve
              - type: tile
                entity: sensor.heating_controller_bedroom_state
                name: State
          - type: vertical-stack
            grid_options: { columns: 6 }
            cards:
              - type: thermostat
                entity: climate.heating_controller_kids_room_1
                name: "Kids room 1"
              - type: glance
                show_icon: false
                entities:
                  - entity: sensor.heating_controller_kids_room_1_floor_temperature
                    name: Floor
                  - entity: sensor.heating_controller_kids_room_1_floor_target
                    name: Floor target
                  - entity: binary_sensor.heating_controller_kids_room_1_valve
                    name: Valve
              - type: tile
                entity: sensor.heating_controller_kids_room_1_state
                name: State
          - type: vertical-stack
            grid_options: { columns: 6 }
            cards:
              - type: thermostat
                entity: climate.heating_controller_kids_room_2
                name: "Kids room 2"
              - type: glance
                show_icon: false
                entities:
                  - entity: sensor.heating_controller_kids_room_2_floor_temperature
                    name: Floor
                  - entity: sensor.heating_controller_kids_room_2_floor_target
                    name: Floor target
                  - entity: binary_sensor.heating_controller_kids_room_2_valve
                    name: Valve
              - type: tile
                entity: sensor.heating_controller_kids_room_2_state
                name: State
          - type: vertical-stack
            grid_options: { columns: 6 }
            cards:
              - type: thermostat
                entity: climate.heating_controller_bathroom
                name: "Bathroom"
              - type: glance
                show_icon: false
                entities:
                  - entity: sensor.heating_controller_bathroom_floor_temperature
                    name: Floor
                  - entity: sensor.heating_controller_bathroom_floor_target
                    name: Floor target
                  - entity: binary_sensor.heating_controller_bathroom_valve
                    name: Valve
              - type: tile
                entity: sensor.heating_controller_bathroom_state
                name: State
      - type: grid
        cards:
          - type: heading
            heading: Boiler
            icon: mdi:water-boiler
          - type: tile
            entity: select.heating_controller_heating_mode
            name: Heating mode
            features: [{ type: select-options }]
            grid_options: { columns: 12 }
          - type: tile
            entity: sensor.heating_controller_outdoor_temperature
            name: Outdoor
          - type: tile
            entity: sensor.heating_controller_calculated_flow_temperature
            name: Calculated flow
          - type: tile
            entity: sensor.heating_controller_flow_setpoint
            name: Flow setpoint
          - type: tile
            entity: sensor.heating_controller_boiler_flow_temperature
            name: Flow
          - type: tile
            entity: sensor.heating_controller_boiler_return_temperature
            name: Return
          - type: tile
            entity: sensor.heating_controller_boiler_modulation
            name: Modulation
          - type: tile
            entity: binary_sensor.heating_controller_boiler_flame
            name: Flame
          - type: tile
            entity: binary_sensor.heating_controller_boiler_heating_demand
            name: Heating demand
          - type: tile
            entity: sensor.heating_controller_heating_water_pressure
            name: Water pressure
          - type: tile
            entity: switch.heating_controller_hot_water
            name: Hot water
          - type: tile
            entity: sensor.heating_controller_hot_water_temperature
            name: Hot water temperature
          - type: tile
            entity: binary_sensor.heating_controller_evening_preheat
            name: Evening preheat
          - type: tile
            entity: sensor.heating_controller_flow_sustained_deficit_boost
            name: Sustained-deficit boost
          - type: tile
            entity: binary_sensor.heating_controller_pump_1
            name: Pump 1
          - type: tile
            entity: binary_sensor.heating_controller_pump_2
            name: Pump 2
          - type: tile
            entity: binary_sensor.heating_controller_boiler_fault
            name: Boiler fault
          - type: tile
            entity: sensor.heating_controller_boiler_fault_code
            name: Fault code
      - type: grid
        cards:
          - type: heading
            heading: Graphs (24 hours)
            icon: mdi:chart-line
          - type: history-graph
            title: Rooms and outdoor
            hours_to_show: 24
            grid_options: { columns: 12 }
            entities:
              - entity: sensor.heating_controller_living_room_room_temperature
                name: "Living room"
              - entity: sensor.heating_controller_hallway_room_temperature
                name: "Hallway"
              - entity: sensor.heating_controller_bedroom_room_temperature
                name: "Bedroom"
              - entity: sensor.heating_controller_kids_room_1_room_temperature
                name: "Kids room 1"
              - entity: sensor.heating_controller_kids_room_2_room_temperature
                name: "Kids room 2"
              - entity: sensor.heating_controller_bathroom_room_temperature
                name: "Bathroom"
              - entity: sensor.heating_controller_outdoor_temperature
                name: Outdoor
          - type: history-graph
            title: Floor
            hours_to_show: 24
            grid_options: { columns: 12 }
            entities:
              - entity: sensor.heating_controller_living_room_floor_temperature
                name: "Living room"
              - entity: sensor.heating_controller_hallway_floor_temperature
                name: "Hallway"
              - entity: sensor.heating_controller_bedroom_floor_temperature
                name: "Bedroom"
              - entity: sensor.heating_controller_kids_room_1_floor_temperature
                name: "Kids room 1"
              - entity: sensor.heating_controller_kids_room_2_floor_temperature
                name: "Kids room 2"
              - entity: sensor.heating_controller_bathroom_floor_temperature
                name: "Bathroom"
          - type: history-graph
            title: Boiler
            hours_to_show: 24
            grid_options: { columns: 12 }
            entities:
              - entity: sensor.heating_controller_boiler_flow_temperature
                name: Flow
              - entity: sensor.heating_controller_boiler_return_temperature
                name: Return
              - entity: sensor.heating_controller_flow_setpoint
                name: Flow setpoint
              - entity: sensor.heating_controller_calculated_flow_temperature
                name: Calculated flow
              - entity: sensor.heating_controller_boiler_modulation
                name: Modulation
          - type: history-graph
            title: Valves
            hours_to_show: 24
            grid_options: { columns: 12 }
            entities:
              - entity: binary_sensor.heating_controller_living_room_valve
                name: "Living room"
              - entity: binary_sensor.heating_controller_hallway_valve
                name: "Hallway"
              - entity: binary_sensor.heating_controller_bedroom_valve
                name: "Bedroom"
              - entity: binary_sensor.heating_controller_kids_room_1_valve
                name: "Kids room 1"
              - entity: binary_sensor.heating_controller_kids_room_2_valve
                name: "Kids room 2"
              - entity: binary_sensor.heating_controller_bathroom_valve
                name: "Bathroom"

  - title: Schedule
    path: schedule
    icon: mdi:calendar-clock
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Times
            icon: mdi:clock-outline
          - type: markdown
            content: >-
              **Night** runs from *night start* to *day start* for zones with night setback, the **evening boost**
              from *boost start* to *boost end* for zones with boost, **comfort** otherwise. Day start is early
              because the floor is slow: rooms reach comfort *by* the time you get up. A manual setpoint change
              holds until the next schedule change. The schedule runs on the controller (RTC), also without Home
              Assistant.
            grid_options: { columns: 12 }
          - type: entities
            show_header_toggle: false
            grid_options: { columns: 12 }
            entities:
              - entity: time.heating_controller_schedule_day_start
                name: Day start
              - entity: time.heating_controller_schedule_night_start
                name: Night start
              - entity: time.heating_controller_schedule_boost_start
                name: Boost start
              - entity: time.heating_controller_schedule_boost_end
                name: Boost end
              - entity: number.heating_controller_night_floor_target
                name: Night floor target
      - type: grid
        cards:
          - type: heading
            heading: "Living room"
            icon: mdi:thermometer
          - type: entities
            show_header_toggle: false
            grid_options: { columns: 12 }
            entities:
              - entity: number.heating_controller_living_room_comfort_temperature
                name: Comfort
              - entity: switch.heating_controller_living_room_night_setback
                name: Night setback
              - entity: number.heating_controller_living_room_night_temperature
                name: Night
              - entity: switch.heating_controller_living_room_evening_boost
                name: Evening boost
              - entity: number.heating_controller_living_room_boost_temperature
                name: Boost
      - type: grid
        cards:
          - type: heading
            heading: "Hallway"
            icon: mdi:thermometer
          - type: entities
            show_header_toggle: false
            grid_options: { columns: 12 }
            entities:
              - entity: number.heating_controller_hallway_comfort_temperature
                name: Comfort
              - entity: switch.heating_controller_hallway_night_setback
                name: Night setback
              - entity: number.heating_controller_hallway_night_temperature
                name: Night
              - entity: switch.heating_controller_hallway_evening_boost
                name: Evening boost
              - entity: number.heating_controller_hallway_boost_temperature
                name: Boost
      - type: grid
        cards:
          - type: heading
            heading: "Bedroom"
            icon: mdi:thermometer
          - type: entities
            show_header_toggle: false
            grid_options: { columns: 12 }
            entities:
              - entity: number.heating_controller_bedroom_comfort_temperature
                name: Comfort
              - entity: switch.heating_controller_bedroom_night_setback
                name: Night setback
              - entity: number.heating_controller_bedroom_night_temperature
                name: Night
              - entity: switch.heating_controller_bedroom_evening_boost
                name: Evening boost
              - entity: number.heating_controller_bedroom_boost_temperature
                name: Boost
      - type: grid
        cards:
          - type: heading
            heading: "Kids room 1"
            icon: mdi:thermometer
          - type: entities
            show_header_toggle: false
            grid_options: { columns: 12 }
            entities:
              - entity: number.heating_controller_kids_room_1_comfort_temperature
                name: Comfort
              - entity: switch.heating_controller_kids_room_1_night_setback
                name: Night setback
              - entity: number.heating_controller_kids_room_1_night_temperature
                name: Night
              - entity: switch.heating_controller_kids_room_1_evening_boost
                name: Evening boost
              - entity: number.heating_controller_kids_room_1_boost_temperature
                name: Boost
      - type: grid
        cards:
          - type: heading
            heading: "Kids room 2"
            icon: mdi:thermometer
          - type: entities
            show_header_toggle: false
            grid_options: { columns: 12 }
            entities:
              - entity: number.heating_controller_kids_room_2_comfort_temperature
                name: Comfort
              - entity: switch.heating_controller_kids_room_2_night_setback
                name: Night setback
              - entity: number.heating_controller_kids_room_2_night_temperature
                name: Night
              - entity: switch.heating_controller_kids_room_2_evening_boost
                name: Evening boost
              - entity: number.heating_controller_kids_room_2_boost_temperature
                name: Boost
      - type: grid
        cards:
          - type: heading
            heading: "Bathroom"
            icon: mdi:thermometer
          - type: entities
            show_header_toggle: false
            grid_options: { columns: 12 }
            entities:
              - entity: number.heating_controller_bathroom_comfort_temperature
                name: Comfort
              - entity: switch.heating_controller_bathroom_night_setback
                name: Night setback
